[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "central-ai"
version = "1.0.0"
description = "Central AI — Stateless Handwriting Analysis and HPI Assessment Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9.0.80",
    "Pillow>=10.3.0",
    "transformers>=4.41.2",
    "torch>=2.3.1",
    "paddleocr==2.7.3",
    "paddlepaddle==2.6.2",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]
